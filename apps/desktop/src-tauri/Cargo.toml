[package]
name = "datapadplusplus-desktop"
version = "0.1.51"
description = "DataPad++ desktop shell"
homepage = "https://datapad-plus-plus.org/"
repository = "https://github.com/FullMontyDevelopment/DataPadPlusPlus"
license-file = "../../../LICENSE"
edition = "2021"

[lib]
name = "datapadplusplus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.11"
async-trait = "0.1"
aws-config = { version = "=1.10.1", features = ["behavior-version-latest"] }
aws-credential-types = "=1.3.0"
aws-sdk-neptunedata = { version = "=1.107.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sigv4 = { version = "=1.5.1", features = ["sign-http"] }
aws-smithy-types = "=1.6.1"
axum = "0.8"
base64 = "0.23"
bigdecimal = "0.4"
chrono = { version = "0.4", default-features = false }
duckdb = { version = "1.10505.0", features = ["bundled"] }
futures-util = "0.3"
flate2 = "1"
hmac = "0.13"
httpdate = "1.0"
keyring = "4.1.6"
mongodb = "3.8"
neo4rs = { version = "=0.8.0", features = ["serde_json"] }
pbkdf2 = "0.13"
percent-encoding = "2"
rand = "0.10"
redis = { version = "1.5", features = ["aio", "tokio-comp", "tokio-native-tls-comp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "gzip", "brotli", "deflate", "charset"] }
rmcp = { version = "3.1.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
rquickjs = { version = "=0.12.2", features = ["classes", "macro", "properties"] }
rustls = "=0.23.43"
rustls-pemfile = "=2.2.0"
scylla = { version = "=1.7.0", features = ["bigdecimal-04", "chrono-04", "rustls-023"] }
semver = "1.0.28"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "mysql", "sqlite", "json", "chrono", "uuid", "bigdecimal"] }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.4"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "native-tls", "sql-browser-tokio"] }
tokio = { version = "1", features = ["io-util", "net", "process", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
toml = "1.1"
tree-sitter = "=0.26.11"
tree-sitter-javascript = "=0.25.0"
url = "2.5.8"
webpki-roots = "=1.0.9"
zip = "8.6.0"
zeroize = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug"] }

[profile.dev]
debug = 2

[profile.dev.package."*"]
debug = 0
