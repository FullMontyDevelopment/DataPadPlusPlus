name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'app-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-tests:
    name: Unit and dependency-free integration tests
    runs-on: ubuntu-22.04
    env:
      # CI intentionally avoids Docker, cloud credentials, and live datastore fixtures.
      DATAPADPLUSPLUS_FIXTURE_RUN: '0'
      RUST_BACKTRACE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install workspace dependencies
        run: npm ci

      - name: Run deterministic CI checks
        id: deterministic
        shell: bash
        run: |
          mkdir -p .test-results
          set -o pipefail
          npm run ci:test 2>&1 | tee .test-results/ci-test.log

      - name: Publish deterministic test summary
        if: always()
        env:
          DATAPADPLUSPLUS_CI_OUTCOME: ${{ steps.deterministic.outcome }}
        run: node tests/ci/write-test-summary.mjs .test-results/ci-test.log

      - name: Compile generated API project pairwise matrix
        run: npm run api-export:validate

  native-smoke:
    name: Native desktop SQLite smoke
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DATAPADPLUSPLUS_E2E_SUITE: smoke
      DATAPADPLUSPLUS_FIXTURE_RUN: '1'
      DATAPADPLUSPLUS_FIXTURE_PROFILE: sqlite-smoke
      DATAPADPLUSPLUS_WORKSPACE_DIR: ${{ runner.temp }}\datapadplusplus-native-smoke
      DATAPADPLUSPLUS_DESKTOP_BINARY: ${{ github.workspace }}\apps\desktop\src-tauri\target\release\datapadplusplus-desktop.exe
      RUST_BACKTRACE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install workspace dependencies
        run: npm ci

      - name: Build native desktop test binary
        run: npm run e2e:desktop:build

      - name: Run native SQLite smoke suite
        run: npm run e2e:desktop:smoke
