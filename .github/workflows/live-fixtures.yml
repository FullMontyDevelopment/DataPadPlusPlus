name: Live Fixture Validation

on:
  pull_request:
    paths:
      - 'apps/desktop/src-tauri/src/adapters/**'
      - 'apps/desktop/src-tauri/tests/adapters_integration.rs'
      - 'apps/desktop/src-tauri/src/app/runtime/datastore_mcp_server/**'
      - 'apps/desktop/src-tauri/src/app/runtime/query_compiler*'
      - 'packages/query-compiler/**'
      - 'apps/desktop/e2e/**'
      - 'tests/fixtures/**'
      - '.github/workflows/live-fixtures.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: Fixture group to validate
        required: true
        default: core
        type: choice
        options:
          - core
          - oracle
          - all

permissions:
  contents: read

concurrency:
  group: live-fixtures-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-fixtures:
    name: Core datastore fixtures
    if: >-
      github.event_name == 'pull_request' ||
      github.event.inputs.profile == 'core' ||
      github.event.inputs.profile == 'all'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      DATAPADPLUSPLUS_FIXTURE_RUN: '1'
      DATAPADPLUSPLUS_FIXTURE_PROFILE: core
      RUST_BACKTRACE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            dbus-x11 \
            file \
            gnome-keyring \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsecret-tools \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget \
            xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install workspace dependencies
        run: npm ci

      - name: Prepare bundled Oracle runtime
        run: |
          npm run oracle:sidecar:ensure
          npm run oracle:sidecar:smoke

      - name: Start and seed core fixtures
        run: |
          npm run fixtures:up
          npm run fixtures:seed

      - name: Validate reference-engine fixture evidence
        run: |
          npm run fixtures:validate:postgres
          npm run fixtures:validate:mongodb
          npm run fixtures:validate:redis

      - name: Run live Rust adapter tests
        run: npm run rust:test:fixtures:core

      - name: Build native desktop fixture binary
        run: npm run e2e:desktop:build

      - name: Run native desktop fixture journeys
        env:
          DATAPADPLUSPLUS_WORKSPACE_DIR: ${{ runner.temp }}/datapadplusplus-live-fixtures
          DATAPADPLUSPLUS_DESKTOP_BINARY: ${{ github.workspace }}/apps/desktop/src-tauri/target/release/datapadplusplus-desktop
        run: dbus-run-session -- xvfb-run -a bash apps/desktop/e2e/with-linux-keyring.sh npm run e2e:desktop

      - name: Prepare additional MCP test providers
        run: |
          docker compose -f tests/fixtures/docker-compose.yml --profile cache --profile cloud-contract up -d --wait valkey dynamodb
          node tests/fixtures/seed.mjs cloud-contract --only

      - name: Run authenticated MCP journeys for all supported test providers
        env:
          DATAPADPLUSPLUS_FIXTURE_PROFILE: cache,cloud-contract
          DATAPADPLUSPLUS_DESKTOP_BINARY: ${{ github.workspace }}/apps/desktop/src-tauri/target/release/datapadplusplus-desktop
        run: |
          for engine in postgresql mongodb redis valkey dynamodb; do
            DATAPADPLUSPLUS_MCP_FIXTURE_ENGINE="$engine" \
              DATAPADPLUSPLUS_WORKSPACE_DIR="${RUNNER_TEMP}/datapadplusplus-mcp-${engine}" \
              dbus-run-session -- xvfb-run -a bash apps/desktop/e2e/with-linux-keyring.sh npm run e2e:desktop:mcp || exit 1
          done

      - name: Stop additional MCP fixtures
        if: always()
        run: docker compose -f tests/fixtures/docker-compose.yml --profile cache --profile cloud-contract stop valkey dynamodb

      - name: Upload desktop failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: live-fixtures-desktop-diagnostics
          path: |
            ${{ runner.temp }}/datapadplusplus-live-fixtures/.e2e-artifacts/
            ${{ runner.temp }}/datapadplusplus-mcp-*/.e2e-artifacts/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Stop fixtures
        if: always()
        run: npm run fixtures:down

  oracle-fixture:
    name: Oracle paging and completion fixture
    if: >-
      github.event.inputs.profile == 'oracle' ||
      github.event.inputs.profile == 'all'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      DATAPADPLUSPLUS_FIXTURE_RUN: '1'
      DATAPADPLUSPLUS_FIXTURE_PROFILE: oracle
      RUST_BACKTRACE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install workspace dependencies
        run: npm ci

      - name: Validate Oracle paging and completion
        run: npm run fixtures:test:oracle

      - name: Stop Oracle fixture
        if: always()
        run: npm run fixtures:stop:oracle
